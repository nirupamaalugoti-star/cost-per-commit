apiVersion: v1
kind: Namespace
metadata:
  name: loadgen
---
# Business-hours traffic: 5 req/s, 2 connections, every 10 minutes Mon-Fri.
# Same traffic pattern in every phase so cost comparisons are fair.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: loadgen
  namespace: loadgen
spec:
  schedule: "*/10 9-17 * * 1-5"
  timeZone: America/New_York
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 60
  failedJobsHistoryLimit: 20
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app: loadgen
        spec:
          restartPolicy: Never
          containers:
            - name: hey
              image: williamyeh/hey
              args: ["-z", "9m", "-q", "5", "-c", "2", "http://web.shop.svc.cluster.local/"]
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
